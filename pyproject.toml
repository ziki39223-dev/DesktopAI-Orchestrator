[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-ai-orchestrator"
version = "0.1.0"
description = "桌面 AI 调度 MCP 服务：用 Windows 原生 UIA + 窗口捕获后台操控 Trae / Qoder / WorkBuddy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
real = [
  "uiautomation>=2.0",
  "comtypes>=1.2",
  "pywin32>=306",
  "windows-capture>=1.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
dao-sse = "desktop_ai_orchestrator.entry.cli:run_sse"
dao-stdio = "desktop_ai_orchestrator.entry.cli:run_stdio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktop_ai_orchestrator = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501：行宽交由格式化器；RUF001/002/003：本项目注释与文档以中文为主，全角标点是有意为之。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["uiautomation.*", "comtypes.*", "win32gui.*", "win32process.*", "windows_capture.*"]
ignore_missing_imports = true
